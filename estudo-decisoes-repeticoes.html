<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho - Decisões e Repetições</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <h1>Trabalho avaliativo: Decisões e repetições</h1>

    <h2>Questão 1 — Controle de entrada em um evento</h2>

    <label for="campoIdade">Idade:</label>
    <input type="text" id="campoIdade">

    <br><br>

    <label for="campoIngresso">Possui ingresso? (sim ou nao):</label>
    <input type="text" id="campoIngresso">

    <br><br>

    <label for="campoConvite">Possui convite? (sim ou nao):</label>
    <input type="text" id="campoConvite">

    <br><br>

    <label for="campoBloqueado">Está bloqueada? (sim ou nao):</label>
    <input type="text" id="campoBloqueado">

    <br><br>

    <button type="button" id="btnEntrada">
        Verificar entrada
    </button>

    <div id="saidaEntrada"></div>

    <hr>

    <h2>Questão 2 — Calculadora com switch</h2>

    <label for="campoNumero1">Primeiro número:</label>
    <input type="text" id="campoNumero1">

    <br><br>

    <label for="campoNumero2">Segundo número:</label>
    <input type="text" id="campoNumero2">

    <br><br>

    <label for="campoOperacao">Operação (+, -, * ou /):</label>
    <input type="text" id="campoOperacao">

    <br><br>

    <button type="button" id="btnCalcular">
        Calcular
    </button>

    <div id="saidaCalculadora"></div>

    <hr>

    <h2>Questão 3 — Números pares e totalização com for</h2>

    <label for="campoLimite">Digite um número inteiro de 1 a 100:</label>
    <input type="text" id="campoLimite">

    <br><br>

    <button type="button" id="btnPares">
        Calcular números pares
    </button>

    <div id="saidaPares"></div>

    <hr>

    <h2>Questão 4 — Simulação de economia com while</h2>

    <label for="campoMeta">Meta de economia (R$):</label>
    <input type="text" id="campoMeta">

    <br><br>

    <label for="campoDeposito">Valor do depósito mensal (R$):</label>
    <input type="text" id="campoDeposito">

    <br><br>

    <button type="button" id="btnEconomia">
        Simular economia
    </button>

    <div id="saidaEconomia"></div>

</body>
</html>
